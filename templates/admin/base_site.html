{% extends "admin/base.html" %}
{% load i18n unfold %}

{% block branding %}
<div id="site-name" class="flex items-center gap-3">
    <div x-on:click="$dispatch('opencommand')" class="flex cursor-pointer items-center gap-2 rounded-lg border border-base-200 bg-base-50 px-3 py-1.5 text-sm text-base-400 hover:text-base-600 dark:border-base-700 dark:bg-base-800 dark:text-base-500">
        <span class="material-symbols-outlined text-base-400 dark:text-base-500">search</span>
        <span class="hidden sm:inline">Rechercher...</span>
        {% include "unfold/helpers/shortcut.html" with shortcut="⌘K" %}
    </div>
    <a href="{% url 'admin:index' %}">
        {{ site_header|default:_('Django administration') }}
    </a>
</div>
{% endblock %}
