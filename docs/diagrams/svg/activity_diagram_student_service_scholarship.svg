@startuml
start
:Student applies for scholarship;
:Service validates eligibility;
if (Eligible?) then (yes)
  :Review application;
  if (Approved?) then (yes)
    :Award scholarship;
    :Update student record;
    :Notify student;
  else (no)
    :Reject application;
  endif
else (no)
  :Return ineligible;
endif
stop
@enduml

