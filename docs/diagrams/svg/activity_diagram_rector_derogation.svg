@startuml
start
:Student requests payment derogation;
:Finance service reviews;
:Forward to rector;
if (Rector approves?) then (yes)
  :Create derogation record;
  :Update payment plan;
  :Notify student;
else (no)
  :Reject request;
  :Notify student;
endif
stop
@enduml

