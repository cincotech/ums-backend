link Profile to User--><path d="M67.5,116.22 C67.5,133.74 67.5,153.18 67.5,170.53 " fill="none" id="Profile-&gt;User" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="67.5,175.84,71.5,166.84,67.5,170.84,63.5,166.84,67.5,175.84" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[43d530ef9b05e8b8be03a50848206266]
@startuml

class Role {
  +id: UUID
  +name: String
  +description: String
}

class User {
  +id: UUID
  +email: String
  +role: ForeignKey
}

class Profile {
  +user: OneToOne
  +dean_fields
  +rector_fields
  +service_fields
}

User - -> Role
Profile - -> User

note right of Role
  Roles:
  - super_admin
  - rector
  - director_academic
  - director_quality_assurance
  - dean
  - student_service
  - finance_service
  - general_service
  - rector_office
  - academic_affairs
  - teacher
  - supervisor
  - student
  - alumni
  - delegate
end note

@enduml

