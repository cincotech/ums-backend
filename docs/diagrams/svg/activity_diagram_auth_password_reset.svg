@startuml
start
:User requests password reset;
:Validate email;
if (Email exists?) then (yes)
  :Generate reset token;
  :Send reset email;
  :User clicks link;
  :Enter new password;
  :Update password;
  :Return success;
else (no)
  :Return error;
endif
stop
@enduml

