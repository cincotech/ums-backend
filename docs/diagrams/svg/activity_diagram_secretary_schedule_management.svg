@startuml
start
:Secretary creates schedule;
:Assign rooms;
:Assign time slots;
:Check conflicts;
if (Conflicts?) then (yes)
  :Resolve conflicts;
else (no)
  :Publish schedule;
  :Notify teachers/students;
endif
stop
@enduml

