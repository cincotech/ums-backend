@startuml
start
:Quality director initiates audit;
:Define standards;
:Conduct compliance audit;
:Generate report;
if (Standards met?) then (yes)
  :Approve program;
  :Track execution;
else (no)
  :Create improvement plan;
  :Schedule re-audit;
endif
stop
@enduml

