# .pre-commit-config.yaml
# ✅ GitHub-only version (no GitLab repos)
# Works cleanly without authentication prompts

repos:
  # 🧹 Basic housekeeping (whitespace, end-of-file, etc.)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']      # <-- only for this hook
        exclude: 'ums/staticfiles/.*'  # optional: ignore staticfiles
      - id: check-merge-conflict
      - id: check-ast

  # 🎨 Black for code formatting
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        language_version: python3

  # 🧾 isort for import sorting (Black-compatible)
  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
        name: isort (python import sorter)
        args: ["--profile", "black"]

  # ⚡ Ruff for linting + auto-fixes
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: ["--fix", "--unsafe-fixes"]



  # 🧩 flake8 (only if you still want it)
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88"]

  # 🛡️ Bandit for security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-lll", "-r"]

  # # 🕵️ Detect secrets before commit
  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.5.0
  #   hooks:
  #     - id: detect-secrets
  #       args: ["--baseline", ".secrets.baseline"]
  #       files: ".*"


  # ⚙️ Local Django-specific hooks
  - repo: local
    hooks:
      # Django checks (basic sanity check)
      - id: django-check
        name: Django check
        entry: bash -c 'python manage.py check --deploy || python manage.py check'
        language: system
        pass_filenames: false

      # Prevent committing unwanted binary data in migrations
      - id: migrations-no-binary
        name: Migrations no-binary
        entry: bash -c 'git diff --cached --name-only --diff-filter=ACM | grep -E "^.+/migrations/.+\\.py$" || true'
        language: system
        pass_filenames: false
